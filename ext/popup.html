<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta http-equiv="X-UA-Compatible" content="ie=edge" />
		<title>Subscribe</title>
		<script src="./js/popup.js" defer type="module"></script>
		<style>
			:root {
				color-scheme: light dark;
				--text-color: #15141a;
				--hover-color: rgba(21, 20, 26, 0.07);
				--label-color: rgba(21, 20, 26, 0.08);
				--label-text-color: rgba(21, 20, 26, 0.7);
			}

			@media (prefers-color-scheme: dark) {
				:root {
					--text-color: #fbfbfe;
					--hover-color: rgba(251, 251, 254, 0.1);
					--label-color: rgba(251, 251, 254, 0.12);
					--label-text-color: rgba(251, 251, 254, 0.75);
				}
			}

			body {
				max-width: 30rem;
				margin: 0;
				font-family: system-ui, sans-serif;
			}

			.items {
				padding: 0.2rem;
			}

			.items__item-link {
				display: block;
				padding: 0.2rem 0.4rem;
				border-radius: 0.25rem;
				color: var(--text-color);
				text-decoration: none;
				overflow-wrap: anywhere;
			}

			[data-button="toolbar"] .items {
				padding: 0.5rem;
			}

			[data-button="toolbar"] .items__item-link {
				padding: 0.5rem 0.75rem;
				border-radius: 0.375rem;
			}

			.items__item-link:hover {
				background: var(--hover-color);
			}

			.items__item-type {
				display: inline-block;
				margin-left: 0.35em;
				padding: 0 0.4em;
				font-size: 0.75em;
				line-height: 1.6;
				vertical-align: 0.1em;
				color: var(--label-text-color);
				background: var(--label-color);
				border-radius: 0.3em;
			}
		</style>
	</head>
	<body>
		<div class="items"></div>
		<template id="item">
			<div class="items__item"><a class="items__item-link" href=""></a></div>
		</template>
	</body>
</html>
